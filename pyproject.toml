[project]
name = "travel-planner"
version = "0.1.0"
description = "Multi-agent travel planner with a streaming chat UI: a coordinator plus flight / hotel / activity specialists, live Kiwi MCP flight search, Tavily web search, and human-in-the-loop booking approval."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.10",
    "langchain-core>=1.3.3",
    "langchain-google-genai>=3.1.0",
    "langchain-mcp-adapters>=0.1.13",
    "langgraph>=1.0.3",
    "langgraph-cli>=0.4.9",
    "langgraph-api>=0.5.37",
    "langgraph-sdk>=0.4.2",
    "mcp>=1.21.1,<2",
    "python-dotenv>=1.2.0",
    "tavily-python>=0.7.13",
]

[tool.uv]
package = false